name: Build Stock Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "ZIP found: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find extracted -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stock-Tracker-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
